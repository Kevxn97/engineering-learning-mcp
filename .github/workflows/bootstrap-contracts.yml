name: Bootstrap dependency contracts
on:
  push:
    paths: ['.github/workflows/bootstrap-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve official packages and inspect installed contracts
        shell: bash
        run: |
          mkdir -p /tmp/elm-contracts
          cd /tmp/elm-contracts
          npm init -y
          npm install --save-exact --ignore-scripts @modelcontextprotocol/server @modelcontextprotocol/client @modelcontextprotocol/node @modelcontextprotocol/fastify fastify @fastify/cookie @fastify/formbody jose openid-client pg zod semver
          npm install --save-dev --save-exact --ignore-scripts typescript @types/node@24 @types/pg @types/semver @playwright/test
          node --version
          cat package.json
          npm ls --depth=0
          find node_modules/@modelcontextprotocol -name '*.d.ts' | head -60
          mkdir contracts
          cp package.json package-lock.json contracts/
          find node_modules/@modelcontextprotocol -name '*.d.ts' -exec cp --parents '{}' contracts/ \;
          cp --parents node_modules/openid-client/build/index.d.ts contracts/
          tar -czf contracts.tar.gz contracts
          tar -czf dependency-bundle.tar.gz node_modules package.json package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-dependency-contracts
          path: /tmp/elm-contracts/*.tar.gz
          retention-days: 3
