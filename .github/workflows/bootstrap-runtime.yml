name: Bootstrap offline test runtime
on:
  push:
    paths: ['.github/workflows/bootstrap-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Collect public release binaries (no project data or secrets)
        shell: bash
        run: |
          mkdir -p /tmp/runtime/bin /tmp/runtime/pg/usr/lib /tmp/runtime/pg/usr/share /tmp/runtime/pg-libs
          cp "$(command -v node)" /tmp/runtime/bin/node
          node --version | tee /tmp/runtime/node-version.txt
          docker pull postgres:18-bookworm
          docker image inspect postgres:18-bookworm --format '{{index .RepoDigests 0}}' | tee /tmp/runtime/postgres-image.txt
          id=$(docker create postgres:18-bookworm)
          docker cp "$id:/usr/lib/postgresql" /tmp/runtime/pg/usr/lib/
          docker cp "$id:/usr/share/postgresql" /tmp/runtime/pg/usr/share/
          docker rm "$id"
          docker run --rm -v /tmp/runtime/pg-libs:/out postgres:18-bookworm bash -c 'for p in /usr/lib/postgresql/18/bin/* /usr/lib/postgresql/18/lib/*.so; do ldd "$p" 2>/dev/null || true; done | awk "/=> \\/.*\\// {print \$3}" | sort -u | grep -vE "/(libc|libm|libpthread|libdl|librt)\\.so" | xargs -r cp -L -t /out'
          cd /tmp/runtime
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C bin gitleaks
          curl -fsSLO https://github.com/keycloak/keycloak/releases/download/26.7.4/keycloak-26.7.4.tar.gz
          sha256sum keycloak-26.7.4.tar.gz | tee keycloak-sha256.txt
          docker pull quay.io/keycloak/keycloak:26.7.4
          docker image inspect quay.io/keycloak/keycloak:26.7.4 --format '{{index .RepoDigests 0}}' | tee keycloak-image.txt
          docker pull node:24-bookworm-slim
          docker image inspect node:24-bookworm-slim --format '{{index .RepoDigests 0}}' | tee node-image.txt
          tar -czf /tmp/offline-runtime.tar.gz bin pg pg-libs *.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-test-runtime
          path: |
            /tmp/offline-runtime.tar.gz
            /tmp/runtime/keycloak-26.7.4.tar.gz
          retention-days: 3
